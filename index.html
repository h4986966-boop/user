<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ragdoll Box</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="app"></div>
    <div id="crosshair"></div>
    <div id="status"></div>
    <div id="toasts"></div>
    <div id="bottom">
      <div id="hint"></div>
      <div id="toolbar"></div>
    </div>
    <div id="overlay">
      <div class="panel">
        <h1>RAGDOLL BOX</h1>
        <p class="sub">physics sandbox · grab, shoot, punch and blow up dummies</p>
        <button id="start" disabled>Loading physics…</button>
        <div class="controls">
          <div><b>WASD</b> move · <b>Shift</b> sprint · <b>Space</b> jump</div>
          <div><b>1–6</b> / <b>wheel</b> switch tool · <b>LMB / RMB</b> use tool</div>
          <div><b>Q</b> slow-mo · <b>F</b> dummy AI (chase / stand / limp) · <b>C</b> spawn wave</div>
          <div><b>G</b> gore on/off · <b>R</b> reset arena · <b>Esc</b> pause</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
